plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 19
        targetSdk = 19
        // CS11: core library desugaring 要求 multidex（AGP 硬性检查）
        multiDexEnabled true

        ndk {
            // CS11 only: the head unit is 32-bit armv7.
            abiFilters 'armeabi-v7a'
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // CS11: the native modules (local_hotspot_radio, legacy_usb, lwip_bridge) build through ndk-build.
    // r25c is the newest NDK that still supports API 19 - its meta/platforms.json says min 19, while
    // r26's floor is 21 (AGP rejects minSdk 19 with r26 outright) - and src/main/jni/Application.mk
    // targets android-19 for the same reason.
    ndkVersion '25.2.9519653'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    // CS11: NewApi now blocks the build. The remaining checks below are either lint's own bugs or
    // meaningless with targetSdk 19 (runtime BLE permissions, Play target-level policy).
    lint {
        abortOnError true
        disable += ['UnsafeOptInUsageError', 'UnsafeOptInUsageWarning', 'MissingPermission',
                    'ExpiredTargetSdkVersion', 'ForegroundServiceType', 'StringFormatMatches',
                    'StringFormatInvalid', 'RestrictedApi', 'SuspiciousIndentation', 'PropertyEscape',
                    'MissingTranslation']
    }

    // CS11 / API 19 blind spot: with core library desugaring enabled, lint's NewApi check only
    // covers the `android.*` platform APIs. It does NOT report `java.*` library APIs
    // (Math.floorDiv(API 24), Objects.requireNonNullElse, java.nio.file, CompletableFuture …) — the
    // API-19 audit produced zero `java.` findings while NtpClock.kt called Math.floorDiv
    // unconditionally on 4.4. The replacement guard is the JVM test
    // `shared/src/test/java/com/shilapi/xcertplay/airplay/ForbiddenLibraryApiTest.kt`, which scans
    // this module's sources on every unit-test run; see docs/_digest/49-API19越界API审计.md.

    // Production code logs through android.util.Log, which the JVM unit tests otherwise reject with
    // "Method w in android.util.Log not mocked" — that alone was failing sixteen of them. Returning
    // defaults makes those calls no-ops so the tests exercise the behaviour they describe.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// CS11: unit tests run on the JVM, where Robolectric already provides
// org.conscrypt:conscrypt-openjdk-uber (desktop classes + native libraries). The Android AAR's
// org.conscrypt classes would still shadow them and fail with
// "UnsatisfiedLinkError: no conscrypt_jni in java.library.path" during Robolectric setup, so the
// Android artifact is excluded from the unit-test classpaths only; the APK keeps it.
configurations
    .matching { it.name.endsWith('UnitTestRuntimeClasspath') || it.name.endsWith('UnitTestCompileClasspath') }
    .configureEach { exclude group: 'org.conscrypt', module: 'conscrypt-android' }
dependencies {
    implementation libs.androidx.annotation
    implementation libs.androidx.core.ktx
    implementation libs.bouncycastle
    implementation libs.jmdns
    implementation libs.conscrypt // CS11: 现代 TLS（TLS1.2/1.3）
    coreLibraryDesugaring libs.desugarJdkLibs
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
